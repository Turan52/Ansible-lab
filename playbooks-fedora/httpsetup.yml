---
- name: Setup httpd and open firewall port
  hosts: all
  become: yes

  tasks:
    - name: Install httpd
      dnf:
        name: httpd
        state: present

    - name: Start httpd service
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Open port 80 for http access
      firewalld:
        port: 80/tcp
        permanent: yes
        state: enabled

    - name: Reload firewalld
      service:
        name: firewalld
        state: reloaded
